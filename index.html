<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Pixel Recuerdo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--fg:#1b1b1b;--card:#fff;--bd:#cfc8ba;--ac:#e53935}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--fg:#f2f2f2;--card:#24242c;--bd:#3a3a46}}
:root[data-theme="dark"]{--bg:#17171c;--fg:#f2f2f2;--card:#24242c;--bd:#3a3a46}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
h1{font-size:1.3rem;margin:0 0 10px;text-align:center}
.wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:960px;margin:0 auto}
.panel{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px;width:260px;max-width:100%}
.panel h2{font-size:.9rem;margin:0 0 8px}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 12px;margin:3px}
button.on{border-color:var(--ac)}
button.main{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700;width:100%;margin:6px 0}
#cv{width:min(512px,100%);aspect-ratio:1;touch-action:none;border:3px solid var(--fg);border-radius:6px;background:#fff;image-rendering:pixelated}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pal i{aspect-ratio:1;border:2px solid var(--bd);border-radius:4px;cursor:pointer}
.pal i.on{border-color:var(--fg);outline:2px solid var(--ac)}
.center{text-align:center;max-width:460px;margin:0 auto}
#cardImg{width:100%;max-width:420px;border-radius:8px;box-shadow:0 4px 18px #0004}
#qr img{width:min(440px,100%);height:auto;image-rendering:pixelated;background:#fff;padding:8px;border-radius:8px}
.small{font-size:.8rem;opacity:.8;word-break:break-all}
[hidden]{display:none!important}
</style></head><body>
<div id="edit">
 <h1>🎨 Crea tu Pixel Art</h1>
 <div class="wrap">
  <canvas id="cv" width="512" height="512"></canvas>
  <div class="panel">
   <h2>Plantillas</h2>
   <button data-t="heart">❤️ Corazón</button><button data-t="smile">😀 Carita</button><button data-t="sword">⚔️ Espada</button><button data-t="potion">🧪 Poción</button><button data-t="alien">👾 Alien</button><button data-t="rocket">🚀 Cohete</button><button data-t="fire">🔥 Fuego</button><button data-t="flower">🌸 Flor</button>
   <h2>Colores</h2><div class="pal" id="pal"></div>
   <h2 style="margin-top:10px">Herramientas</h2>
   <button id="bPen" class="on">✏️ Lápiz</button><button id="bEr">🧽 Borrador</button>
   <button id="b16" class="on">16×16</button><button id="b32">32×32</button>
   <button id="bClr">🗑️ Limpiar</button>
   <button class="main" id="bDone">✅ Finalizar</button>
  </div>
 </div>
</div>
<div id="res" hidden><div class="center">
 <h1>¡Tu ficha de recuerdo!</h1>
 <img id="cardImg" alt="Ficha de recuerdo">
 <h2>📱 Escanea: se necesita internet para descargar la imagen</h2>
 <div id="qr"></div><p class="small" id="urlTxt"></p>
 <button class="main" id="bNew">🔄 Nuevo dibujo</button>
</div></div>
<div id="ph" hidden><div class="center">
 <h1>¡Tu pixel art!</h1>
 <img id="cardImg2" alt="Tu ficha">
 <button class="main" id="bDl">⬇️ Descargar PNG</button>
 <p class="small" id="hint">Tip: mantén presionada la imagen para guardarla.</p>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const SCHOOL=["Institución Educativa","Colegio Francisco José de Caldas"];
const DEVS="Desarrollado por: Yeshua Rey & Nelson Venegas";
const GRADE="10-02";
// Pon aqui tu direccion de GitHub Pages, ej: "https://TU-USUARIO.github.io/NOMBRE-REPO/" (si la dejas vacia usa la direccion actual)
const SITE_URL="https://yeshuarey.github.io/Pixel-Feria/";
const EVENT="Feria de la Innocreatividad";
const PAL=['#00bcd4','#1b1b1b','#ffffff','#e53935','#fb8c00','#fdd835','#43a047','#1b5e20','#1e88e5','#4fc3f7','#8e24aa','#f48fb1','#6d4c41','#9e9e9e','#424242','#ffcc99'];
const HX='0123456789abcdef';
const $=id=>document.getElementById(id);
let N=16,g=[],col='3',erase=false,down=false,cardCv=null;
function sword(){const a=Array.from({length:16},()=>Array(16).fill('.'));const s=(x,y,c)=>{if(x>=0&&y>=0&&x<16&&y<16)a[y][x]=c};
 for(let i=0;i<9;i++){s(14-i,1+i,'9');if(i)s(13-i,1+i,'8')}
 s(15,0,'2');for(let k=-2;k<=2;k++)s(5+k,10+k,'5');
 s(4,11,'c');s(3,12,'c');s(2,13,'c');s(1,14,'5');return a.map(r=>r.join(''))}
const E="................";
const T={
heart:[E,"..1111....1111..",".133331..133331.","1323333113333331","1333333333333331","1333333333333331",".13333333333331.","..133333333331..","...1333333331...","....13333331....",".....133331.....","......1331......",".......11.......",E,E,E],
smile:[E,E,".....111111.....","...1155555511...","..155555555551..",".15551555515551.","1555515555155551","1555555555555551","1515555555555151","1551155555511551","1555511111155551",".15555555555551.","..155555555551..","...1155555511...",".....111111.....",E].slice(0,16),
sword:sword(),
alien:[E,"....a......a....",".....a....a.....","....aaaaaaaa....","...aaaaaaaaaa...","..aaaaaaaaaaaa..","..aaa22aa22aaa..","..aaa21aa12aaa..","..aaaaaaaaaaaa..","..a.aaaaaaaa.a..","..a.a......a.a..",".....aa..aa.....",E,E,E,E],
rocket:[".......11.......","......1331......",".....133331.....",".....133331.....","....12222221....","....12288221....","....12288221....","....12222221....","...3122222213...","..331222222133..","..3.12222221.3..","....11111111....",".....455554.....","......4554......",".......44.......",E],
fire:["........3.......",".......33.......",".......343...3..","......3443..33..","..3...34443.343.","..33.3444443.343",".33444444544443.",".344444555544443",".344445555554443",".344455555555443",".344555555555443","..344555555443..","...3444444443...","....33444433....",".....333333.....",E],
flower:["......bbbb......","....bbbbbbbb....","...bbbb55bbbb...","...bbb5555bbb...","...bbb5555bbb...","...bbbb55bbbb...","....bbbbbbbb....","......bbbb......",".......66.......","..666..66.......","...666666.......",".......666666...",".......66.666...",".......66.......",".......66.......",".......66......."],
potion:["......cccc......","......1221......","......1221......",".....122221.....","....11222211....","...1aaaaaaaa1...","..1aaaaaaaaaa1..","..1aa2aaaaaaa1..","..1aa2aaaaaaa1..","..1aaaaaaaaaa1..","..1aaaaaaaaaa1..","...1aaaaaaaa1...","....11111111....",E,E,E]};
function init(n){N=n;g=Array(N*N).fill('.');draw()}
function load(t){g=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)g.push(t[Math.floor(y*16/N)][Math.floor(x*16/N)]);draw()}
function paint(ctx,size,gr,n,grid){const s=size/n;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=gr[y*n+x];ctx.fillStyle=c==='.'?((x+y)%2?'#eeeeee':'#fafafa'):PAL[parseInt(c,16)];ctx.fillRect(x*s,y*s,s+.5,s+.5)}
 if(grid){ctx.strokeStyle='#0002';ctx.lineWidth=1;for(let i=1;i<n;i++){ctx.beginPath();ctx.moveTo(i*s,0);ctx.lineTo(i*s,size);ctx.moveTo(0,i*s);ctx.lineTo(size,i*s);ctx.stroke()}}}
function draw(){paint($('cv').getContext('2d'),512,g,N,true)}
function at(e){const r=$('cv').getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*N),y=Math.floor((e.clientY-r.top)/r.height*N);if(x<0||y<0||x>=N||y>=N)return;const v=erase?'.':col;if(g[y*N+x]!==v){g[y*N+x]=v;draw()}}
const cv=$('cv');cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);at(e)};cv.onpointermove=e=>{if(down)at(e)};cv.onpointerup=cv.onpointercancel=()=>down=false;
PAL.forEach((c,i)=>{const d=document.createElement('i');d.style.background=c;d.onclick=()=>{col=HX[i];erase=false;sel()};d.dataset.c=HX[i];$('pal').appendChild(d)});
function sel(){document.querySelectorAll('.pal i').forEach(d=>d.classList.toggle('on',d.dataset.c===col&&!erase));$('bPen').classList.toggle('on',!erase);$('bEr').classList.toggle('on',erase)}
$('bPen').onclick=()=>{erase=false;sel()};$('bEr').onclick=()=>{erase=true;sel()};
$('bClr').onclick=()=>init(N);
$('b16').onclick=()=>{$('b16').classList.add('on');$('b32').classList.remove('on');init(16)};
$('b32').onclick=()=>{$('b32').classList.add('on');$('b16').classList.remove('on');init(32)};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>load(T[b.dataset.t]));
function card(gr,n){const c=document.createElement('canvas');c.width=600;c.height=800;const x=c.getContext('2d');
 x.fillStyle='#fff8e7';x.fillRect(0,0,600,800);x.strokeStyle='#1b1b1b';x.lineWidth=10;x.strokeRect(15,15,570,770);x.lineWidth=3;x.strokeRect(30,30,540,740);
 x.save();x.translate(60,60);paint(x,480,gr,n,false);x.restore();x.lineWidth=6;x.strokeRect(60,60,480,480);
 x.fillStyle='#1b1b1b';x.textAlign='center';x.font='bold 24px sans-serif';x.fillText(SCHOOL[0],300,592);x.font='bold 26px sans-serif';x.fillText(SCHOOL[1],300,626);
 x.font='20px sans-serif';x.fillText(DEVS,300,676);x.font='bold 22px sans-serif';x.fillText(GRADE,300,708);x.font='italic 22px sans-serif';x.fillText(EVENT,300,750);return c}
function show(id){['edit','res','ph'].forEach(v=>$(v).hidden=v!==id)}
$('bDone').onclick=()=>{cardCv=card(g,N);$('cardImg').src=cardCv.toDataURL('image/png');
 const base=(SITE_URL||location.href).split('#')[0];
 const url=base+'#d='+N+':'+g.join('');
 try{const q=qrcode(0,N>16?'L':'M');q.addData(url);q.make();$('qr').innerHTML=q.createImgTag(4,4)}catch(e){$('qr').textContent='No se pudo generar el QR'}
 $('urlTxt').textContent=base;show('res')};
$('bNew').onclick=()=>{init(N);show('edit')};
$('bDl').onclick=()=>{cardCv.toBlob(async b=>{const f=new File([b],'mi-pixel-art.png',{type:'image/png'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mi-pixel-art.png';document.body.appendChild(a);a.click();a.remove()},'image/png')};
function phone(d){const m=d.match(/^#d=(\d+):(.+)$/);if(!m)return false;const n=+m[1],gr=m[2].split('');if(gr.length!==n*n)return false;
 cardCv=card(gr,n);$('cardImg2').src=cardCv.toDataURL('image/png');
 show('ph');return true}
init(16);sel();if(!phone(location.hash))show('edit');
</script></body></html>
